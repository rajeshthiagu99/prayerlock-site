<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Prayer Lock</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ui:'Baloo 2','Baloo Thambi 2','Baloo Tamma 2','Baloo Tammudu 2','Baloo Chettan 2','Baloo Da 2','Baloo Bhai 2','Baloo Paaji 2',system-ui,sans-serif;
  --scr:'Tiro Devanagari Hindi','Tiro Tamil','Tiro Kannada','Tiro Telugu','Tiro Bangla','Tiro Gurmukhi','Noto Serif Malayalam','Noto Serif Gujarati',serif;
  --bg:#FFF5E1;--card:#FFFDF8;--tint:#FBE6BF;--ink:#26170A;--muted:#7A6248;--line:#26170A;
  --pri:#D9560B;--priInk:#FFFDF8;--ok:#2F6B2F;--bad:#B3261E;--god:#D9560B;--bead:#E9D3AE;
  --r:14px;--bw:2px;--sh:3px 3px 0 var(--line);
}
body[data-theme=sandhya]{--bg:#110E1B;--card:#1C182D;--tint:#2A2442;--ink:#F7EEDC;--muted:#A69EC2;--line:#3A3360;--pri:#F2B544;--priInk:#1A1406;--bead:#3A335F;--sh:none}
body[data-theme=kumkum]{--bg:#EFE7DA;--card:#FAF6EE;--tint:#E4D8C4;--ink:#1E1914;--muted:#6B6153;--line:#1E1914;--pri:#A8231B;--priInk:#FFF6EA;--bead:#CDBFA8;--r:4px;--bw:1.5px;--sh:none}
body[data-theme=peacock]{--bg:#0D3B42;--card:#124A52;--tint:#1A5C64;--ink:#F4EBD9;--muted:#A9C7C4;--line:#2B6E76;--pri:#E9B949;--priInk:#1A1406;--bead:#24666E;--sh:none}
body[data-theme=tulsi]{--bg:#F2F5E8;--card:#FFFFFF;--tint:#DCE7C6;--ink:#1D2A15;--muted:#5E6E50;--line:#1D2A15;--pri:#3D7A2C;--priInk:#fff;--bead:#CBDDB0}
body[data-theme=swarna]{--bg:#0B0907;--card:#17130E;--tint:#241D14;--ink:#F6EBD3;--muted:#B5A587;--line:#3A2E1E;--pri:#E8B04B;--priInk:#1A1206;--bead:#3A2E1E;--sh:none;--r:18px}
body[data-theme=swarna] .btn{background:linear-gradient(180deg,#F2C46A,#D99A2B)}
body[data-font=anek]{--ui:'Anek Latin','Anek Devanagari','Anek Tamil','Anek Telugu','Anek Kannada','Anek Malayalam','Anek Bangla','Anek Gujarati','Anek Gurmukhi',system-ui,sans-serif}
body[data-font=noto]{--ui:'Noto Sans','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi',system-ui,sans-serif}
body[data-font=tiro] h1{font-family:var(--scr);font-weight:400;font-size:31px}
body[data-font=tiro] .btn{font-family:var(--scr);font-weight:400}
/* images */
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 14px)) -22px 0;height:min(300px,32vh);flex:none;background:var(--god) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,var(--bg) 100%)}
.hero.short{height:240px}
.hero.dim{filter:grayscale(.6) brightness(.75)}
.big-n{font-size:72px;font-weight:800;line-height:1;color:var(--god);font-variant-numeric:tabular-nums}
.chk-row{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin:10px 0;opacity:.25;transition:opacity .4s}
.chk-row.on{opacity:1}
.chk-row i{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;display:grid;place-items:center;font-size:12px}
.env-grid{position:relative;height:330px;margin:10px 0}
.env{position:absolute;width:118px;height:150px;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;perspective:600px}
.env .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.env.open .in{transform:rotateY(180deg)}
.env .f,.env .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.env .f{background:linear-gradient(160deg,#B3261E,#7A1410);border:3px solid #E8B04B;box-shadow:0 8px 18px rgba(0,0,0,.25);color:#F8D57E;font-family:var(--scr);font-size:26px}
.env .f::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(160deg,#C9362C,#8E1A13);clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:2px solid #E8B04B}
.env .f span{position:relative;margin-top:40px}
.env .b{transform:rotateY(180deg);background:#FFF8E7;border:3px solid #E8B04B;color:#7A1410;font-weight:800;font-size:34px;line-height:1}
.env .b small{font-size:14px;font-weight:800;letter-spacing:.1em}
.env.dimmed{opacity:.35;pointer-events:none}
.env.shake{animation:shk .5s}
@keyframes shk{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.petal{position:fixed;top:-20px;width:12px;height:16px;border-radius:60% 60% 50% 50%;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r2))}}
.vsbar{display:flex;gap:22px;justify-content:center;align-items:flex-end;height:250px;margin:16px 0}
.vsbar div{width:96px;border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:10px;font-weight:800;color:#fff;text-align:center;font-size:15px}
.vsbar p{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;width:96px}
.ticket{border:2px dashed var(--god);border-radius:16px;padding:18px;text-align:center;background:var(--card);position:relative}
.ticket .pct{font-size:58px;font-weight:800;color:var(--god);line-height:1}
.plan svg{display:block;margin:6px auto}
.mini{width:250px;height:420px;margin:6px auto 0;border-radius:30px;border:8px solid #111;overflow:hidden;background:var(--bg);box-shadow:0 18px 40px rgba(0,0,0,.25);position:relative}
.mini-in{padding:18px 12px;display:flex;flex-direction:column;align-items:center;animation:none}
.mini .ring{width:130px;height:130px}
.mini .mantra{font-size:17px!important;line-height:1.25;max-height:44px;overflow:hidden}
.mini .cnt{font-size:24px!important}
/* button styles */
body[data-btn=chunky] .btn{min-height:64px;border:2.5px solid var(--line);border-radius:12px;box-shadow:5px 5px 0 var(--line);font-size:19px;font-weight:800;letter-spacing:.01em}
body[data-btn=chunky].dark .btn{border-color:var(--ink);box-shadow:5px 5px 0 rgba(255,255,255,.85)}
body[data-btn=chunky] .btn:active{transform:translate(5px,5px);box-shadow:none}
body[data-btn=pill] .btn{min-height:60px;border:none;border-radius:999px;box-shadow:0 10px 24px color-mix(in srgb,var(--pri) 45%,transparent);font-weight:800}
body[data-btn=pill] .btn:active{transform:scale(.97)}
body[data-btn=d3] .btn{min-height:60px;border:none;border-radius:16px;box-shadow:0 6px 0 color-mix(in srgb,var(--pri) 60%,#000);font-weight:800;margin-bottom:6px}
body[data-btn=d3] .btn:active{transform:translateY(6px);box-shadow:none}
body[data-btn=soft] .btn{min-height:56px;border:none;border-radius:14px;box-shadow:none;font-weight:700}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 22px);overflow-y:auto;animation:up .28s ease both;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 86px)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;align-items:center;gap:10px;height:40px;margin-bottom:8px;flex:none}
.back{width:40px;height:40px;border:none;background:none;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;margin-left:-10px}
.bar{flex:1;height:4px;background:var(--tint);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--pri);transition:width .3s}
h1{font-weight:800;font-size:30px;line-height:1.12;letter-spacing:-.01em;margin:4px 0 6px}
h3{font-weight:700;font-size:18px;margin:16px 0 8px}
.sub{color:var(--muted);font-size:16px;line-height:1.35;margin-bottom:12px}
.grow{flex:1;min-height:12px}
.c{text-align:center}
.btn{display:block;width:100%;min-height:56px;flex:none;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--pri);color:var(--priInk);font:inherit;font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s;padding:0 16px}
body.dark .btn{border-color:transparent}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.stick{position:sticky;bottom:0;z-index:4}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.link{display:block;margin:8px auto 0;background:none;border:none;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;min-height:44px;padding:0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:600;cursor:pointer}
body.dark .opt{border-width:1px}
.opt small{display:block;font-weight:500;font-size:13px;color:var(--muted);line-height:1.3}
.opt.on{background:var(--tint);box-shadow:var(--sh)}
body.dark .opt.on{outline:2px solid var(--pri);outline-offset:-2px}
.chk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;color:var(--priInk)}
.on .chk{background:var(--pri);border-color:var(--pri)}
.input{width:100%;font:inherit;font-size:22px;font-weight:600;padding:14px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);outline:none}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs .opt{margin:0;justify-content:center;font-size:21px;padding:14px 6px}
.gods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.god{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border:var(--bw) solid transparent;border-radius:var(--r);background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:700;line-height:1.15;cursor:pointer;text-align:center}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--scr);font-size:26px;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);flex:none}
.god.on{border-color:var(--line);background:var(--card);box-shadow:var(--sh)}
.seg{display:flex;gap:8px;margin:4px 0 8px}
.seg button{flex:1;padding:10px 0;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.perm{display:flex;gap:12px;align-items:center;padding:13px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:9px}
body.dark .perm{border-width:1px}
.perm .n{width:32px;height:32px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:800;flex:none}
.perm.ok .n{background:var(--ok);color:#fff}
.perm b{display:block;font-size:16px;line-height:1.2}
.perm span.s{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.perm .go{margin-left:auto;flex:none;padding:8px 14px;border-radius:999px;border:none;background:var(--pri);color:var(--priInk);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.perm.ok .go{background:none;color:var(--ok);pointer-events:none}
.perm.wait .go{opacity:.35}
.trust{display:flex;gap:10px;font-size:13px;color:var(--muted);line-height:1.35;padding:10px 12px;border-radius:var(--r);background:var(--tint);margin-bottom:12px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.vs div{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 12px}
.vs b{display:block;font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.vs span{font-size:14px;color:var(--muted);font-weight:600}
.vs .god-side b{color:var(--god)}
.applist .row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--tint);cursor:pointer}
.applist img,.applist .ai{width:40px;height:40px;border-radius:11px;flex:none}
.ai{display:grid;place-items:center;color:#fff;font-weight:800}
.applist b{display:block;font-size:16px}
.applist small{color:var(--muted);font-size:13px}
.ring{display:block;margin:0 auto}
.ring .bd{fill:var(--bead);transition:fill .15s}
.ring .bd.on{fill:var(--god)}
.ring .meru{fill:var(--god)}
.mantra{font-family:var(--scr);font-size:30px;line-height:1.3;text-align:center}
.cnt{font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.pulse{animation:pl .18s}
@keyframes pl{50%{transform:scale(1.07)}}
.hold{position:relative;width:190px;height:190px;margin:8px auto;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:none}
.hold svg{position:absolute;inset:0}
.hold span{font-weight:700;font-size:15px;color:var(--muted);text-align:center;padding:0 34px}
.feat{list-style:none;margin:4px 0 10px}
.feat li{display:flex;gap:10px;align-items:center;font-size:16px;font-weight:600;padding:6px 0;line-height:1.25}
.feat li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.price{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;position:relative;box-shadow:var(--sh)}
.price .off{position:absolute;top:-12px;right:14px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.price s{color:var(--muted);font-size:17px}
.price .p{font-size:32px;font-weight:800;line-height:1.1}
.price .d{font-size:14px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0;line-height:1.35}
.x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;width:36px;height:36px;border-radius:50%;border:none;background:var(--tint);color:var(--muted);font-size:15px;cursor:pointer;z-index:3}
.wheel{width:240px;height:240px;margin:10px auto;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.17,.67,.18,1)}
.wheel::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:12px solid transparent;border-top:18px solid var(--ink);z-index:2}
.timer{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--tint);font-weight:700;font-variant-numeric:tabular-nums}
.card{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
body.dark .card{border-width:1px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 6px;text-align:center}
body.dark .stats div{border-width:1px}
.stats b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--tint);font-weight:700;font-size:15px;margin-bottom:12px;cursor:pointer}
.banner.warn{background:var(--bad);color:#fff}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:24px;height:24px;border-radius:50%;background:var(--tint);display:block}
.week i.on{background:var(--ok)}
.week i.today{outline:2px solid var(--pri);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
body.dark .tabs{border-top-width:1px}
.tabs button{flex:1;background:none;border:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:20px;line-height:1}
.tabs button.on{color:var(--pri)}
.li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--tint);cursor:pointer;font-size:16px;font-weight:600}
.li small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.li .r{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600;text-align:right}
.verse{font-family:var(--scr);font-size:22px;line-height:1.65;text-align:center;margin:14px 0 4px;white-space:pre-line}
.mean{font-size:15px;line-height:1.45;color:var(--muted);text-align:center;margin-bottom:14px}
.vdiv{width:40px;height:2px;background:var(--tint);margin:10px auto}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:50;background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:15px;animation:up .2s both;text-align:center}
.lockapp{display:flex;justify-content:center;align-items:center;gap:10px}
.lockapp img,.lockapp .ai{width:36px;height:36px;border-radius:10px}
/* android mocks (browser preview only) */
.sheet{position:fixed;inset:0;z-index:60;background:#F6F2FA;color:#1C1B1F;font-family:Roboto,system-ui,sans-serif;animation:up .2s both;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet .hd{display:flex;align-items:center;gap:14px;padding:18px 16px;font-size:21px}
.sheet .row{display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:16px;position:relative}
.sheet .row small{display:block;color:#625B71;font-size:13px}
.sheet .ico{width:36px;height:36px;border-radius:10px;flex:none}
.sheet .hint{margin:4px 16px 8px;padding:10px 12px;border-radius:12px;background:#E8DEF8;font-size:14px;line-height:1.35}
.tog{margin-left:auto;width:52px;height:32px;border-radius:16px;background:#E7E0EC;border:2px solid #79747E;position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:#79747E;transition:.2s}
.tog.on{background:#6750A4;border-color:#6750A4}
.tog.on::after{left:24px;top:2px;width:24px;height:24px;background:#fff}
.poke{position:absolute;right:30px;top:20px;font-size:28px;animation:pk 1s ease-in-out infinite;pointer-events:none}
@keyframes pk{50%{transform:translate(-6px,-6px)}}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:28px;animation:up .2s both}
.dlg>div{background:#ECE6F0;color:#1C1B1F;font-family:Roboto,system-ui,sans-serif;border-radius:28px;padding:24px;width:100%;max-width:340px}
.dlg h4{font-size:20px;font-weight:500;margin-bottom:12px;line-height:1.25}
.dlg p{font-size:14px;color:#49454F;line-height:1.4;margin-bottom:18px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg .acts button{background:none;border:none;color:#6750A4;font-weight:600;font-size:15px;padding:10px 12px;cursor:pointer}
select.sel{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:var(--bw) solid var(--line);border-radius:10px;padding:6px 8px;max-width:170px}
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script src="content-gita.js" onerror="0"></script>
<script src="i18n.js"></script>
<script src="i18n-more.js" onerror="0"></script>
<script>
"use strict";
/* ============ content fallback (until content.js exists) ============ */
if(!window.CONTENT){window.CONTENT={deities:{
 hanuman:{name:{en:'Hanuman',hi:'हनुमान'},honorific:{en:'Hanuman ji',hi:'हनुमान जी'},japa:{en:'Jai Hanuman',hi:'जय हनुमान'},glyph:'ह',color:'#E0620D',texts:[],regions:['hi']},
 shiva:{name:{en:'Shiva',hi:'शिव'},honorific:{en:'Shiva',hi:'शिव जी'},japa:{en:'Om Namah Shivaya',hi:'ॐ नमः शिवाय'},glyph:'ॐ',color:'#3F5A8A',texts:[],regions:['hi']},
 ram:{name:{en:'Ram',hi:'राम'},honorific:{en:'Shri Ram',hi:'श्री राम'},japa:{en:'Ram',hi:'राम'},glyph:'रा',color:'#C2410C',texts:[],regions:['hi']}
},texts:{},festivals:[]}}
const C=window.CONTENT,I=window.I18N;
const LANGS=['hi','ta','te','kn','ml','mr','bn','gu','pa','en'].filter(l=>I[l]);
const REVIEW_HASH=27246139; // set at build time from keystore/reviewer-code.txt

/* ============ bridge (native PL or browser mock) ============ */
const NATIVE=!!window.PL;
const Mock=(()=>{const g={usage:false,overlay:false,popup:false,battery:false,notif:false,autostart:false};let brand='xiaomi',lock=null,plus=false;
 const A=[['com.instagram.android','Instagram','#D6249F',126],['com.google.android.youtube','YouTube','#FF0000',98],['com.whatsapp','WhatsApp','#25D366',61],['in.mohalla.sharechat','ShareChat','#F15A24',40],['com.dts.freefireth','Free Fire','#E86A10',35],['com.facebook.katana','Facebook','#1877F2',22],['in.mohalla.video','Moj','#7B2FF7',18],['com.snapchat.android','Snapchat','#E6C700',12],['in.startv.hotstar','JioHotstar','#0B2A6F',9],['com.phonepe.app','PhonePe','#5F259F',7],['com.google.android.apps.maps','Maps','#34A853',5]];
 const autoNeeded=()=>['xiaomi','vivo','oppo','realme','oneplus'].includes(brand);
 return{_mock:true,setBrand(b){brand=b},
  perms:()=>JSON.stringify({...g,brand,popupNeeded:['xiaomi','vivo','oppo','realme','oneplus'].includes(brand),autostart:autoNeeded()?g.autostart:true}),
  openPerm(n){mockSheet(n,()=>{g[n]=true;setTimeout(()=>window.plResume&&plResume(),50)})},
  apps:()=>JSON.stringify(A.map(([pkg,label,col,min])=>({pkg,label,icon:'',col,min}))),
  usage:()=>JSON.stringify({totalMin:A.reduce((s,a)=>s+a[3],0)+40,apps:A.slice(0,8).map(([pkg,label,,min])=>({pkg,label,min}))}),
  setLock(j){lock=j},getLock:()=>lock||'{}',lockStatus:()=>JSON.stringify({running:!!lock,permsOk:g.usage&&g.overlay}),
  unlocked(p){go('home');toast(t('unlocked',{app:lockLabel,m:S.unlockMin}))},prayed(){},goHome(){go('home')},
  track(){},buy(p){setTimeout(()=>{plus=true;window.onPurchase&&onPurchase(true,+p,'')},700)},restore(){toast(t('no_purchase'))},isPlus:()=>plus,
  haptic(k,ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}},reminders(){},share(){},openUrl(u){window.open(u,'_blank')},version:()=>1}})();
const PL=window.PL||Mock;
const J=(s,d)=>{try{return JSON.parse(s)}catch(e){return d}};
const track=(e,p)=>{try{p?PL.track(e,JSON.stringify(p)):PL.track(e)}catch(x){}};
const vib=(ms=12)=>{try{PL.haptic('tap',ms)}catch(e){}};

/* ============ state ============ */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const S=Object.assign({lang:'',deity:'',name:'',apps:[],labels:{},prayer:'jap',count:11,mode:'every',unlockMin:15,step:'lang',done:false,plus:false,spun:false,o2:0,japDay:'',japToday:0,japTotal:0,days:[],t2:600,dark:false,theme:'marigold',font:'baloo',btn:'chunky',role:'',want:[],hours:-1,morn:'',env1:0,envDone:false,o3until:0,rem:{am:'06:30',pm:'19:00'}},J(localStorage.getItem('pl'),{}));
const save=()=>localStorage.setItem('pl',JSON.stringify(S));
if(S.japDay!==today()){S.japDay=today();S.japToday=0}
const q=new URLSearchParams(location.search);
const LOCK=q.get('lock');let lockLabel=q.get('label')||'';

/* ============ text helpers ============ */
const L=()=>S.lang||'en';
const pick=(o,l=L())=>o?(o[l]??o.hi??o.en??Object.values(o)[0]):'';
const god=()=>C.deities[S.deity]||C.deities[Object.keys(C.deities)[0]];
const godName=()=>pick(god().honorific)||pick(god().name);
function t(k,v={}){let s=(I[L()]&&I[L()][k])??I.en[k]??k;v={god:godName(),name:S.name||'',...v};for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s.replace(/^,\s*|\s*,\s*$/g,'').replace(/\s+,/g,',')}
const japa=()=>pick(god().japa);
function glyph(k){k=k||S.deity;const d=C.deities[k]||god();if(k==='murugan'&&L()==='ta')return 'வேல்';if(['hi','mr','en'].includes(L()))return k==='murugan'?'स्कं':(d.glyph||'ॐ');const nm=pick(d.name).replace(/^(ஸ்ரீ|శ్రీ|ಶ್ರೀ|ശ്രീ|শ্রী|શ્રી|ਸ਼੍ਰੀ)\s*/,'');try{return [...new Intl.Segmenter(L(),{granularity:'grapheme'}).segment(nm)][0].segment}catch(e){return nm[0]}}
const hm=m=>m>=60?t('u_h',{n:Math.floor(m/60)})+' '+t('u_m',{n:m%60}):t('u_m',{n:m});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEAD={hi:['ram','hanuman','shiva','krishna','radha_krishna','devi'],ta:['murugan','shiva','devi','vishnu','ganesha','venkatesha','ayyappa'],te:['venkatesha','shiva','ram','hanuman','devi','ganesha'],kn:['venkatesha','shiva','ganesha','hanuman','devi','vishnu'],ml:['ayyappa','krishna','devi','shiva','ganesha','murugan'],mr:['ganesha','vishnu','shiva','ram','hanuman','devi'],bn:['devi','krishna','shiva','radha_krishna','ganesha','lakshmi'],gu:['krishna','hanuman','devi','shiva','ganesha','ram'],pa:['devi','shiva','hanuman','ram','krishna','ganesha'],en:['ram','hanuman','shiva','krishna','devi','ganesha']};
function godOrder(){const base=(C.deityOrder||Object.keys(C.deities)).filter(k=>C.deities[k]);const lead=(LEAD[L()]||[]).filter(k=>C.deities[k]);return [...lead,...base.filter(k=>!lead.includes(k))]}
const DARK=['sandhya','peacock','swarna'];
const GF={anek:'Anek+Latin:wght@500;700;800&family=Anek+Devanagari:wght@500;700;800&family=Anek+Tamil:wght@500;700;800&family=Anek+Telugu:wght@500;700;800&family=Anek+Kannada:wght@500;700;800&family=Anek+Malayalam:wght@500;700;800&family=Anek+Bangla:wght@500;700;800&family=Anek+Gujarati:wght@500;700;800&family=Anek+Gurmukhi:wght@500;700;800',noto:'Noto+Sans:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&family=Noto+Sans+Telugu:wght@500;700;800&family=Noto+Sans+Kannada:wght@500;700;800&family=Noto+Sans+Malayalam:wght@500;700;800&family=Noto+Sans+Bengali:wght@500;700;800&family=Noto+Sans+Gujarati:wght@500;700;800&family=Noto+Sans+Gurmukhi:wght@500;700;800'};
function applyGod(){if(S.dark&&S.theme==='marigold')S.theme='sandhya';const b=document.body;b.dataset.theme=S.theme;b.dataset.font=S.font;b.dataset.btn=S.btn||'chunky';b.classList.toggle('dark',DARK.includes(S.theme));
 if(GF[S.font]&&!document.getElementById('gf-'+S.font)){const l=document.createElement('link');l.id='gf-'+S.font;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+GF[S.font]+'&display=swap';document.head.appendChild(l)}
 document.documentElement.style.setProperty('--god',god().color||'#D9560B');document.documentElement.lang=L()}
const img=(k,hero)=>`img/deity/${k}${hero?'-hero':''}.webp`;
const avatar=(k,sz)=>`<span class="av" style="background:${C.deities[k].color};${sz?`width:${sz}px;height:${sz}px;font-size:${sz*.42}px`:''}">${esc(glyph(k))}<img src="${img(k)}" alt="" onerror="this.remove()"></span>`;
const heroBg=(cls='')=>`<div class="hero ${cls}" style="background-color:var(--god);background-image:url(${img(S.deity,1)}),url(${img(S.deity)})"></div>`;
const storyBg=n=>`<div class="hero" style="background-image:url(img/story/${n}.webp)"></div>`;
const HRS=[2,4,6,8];const hrsN=()=>HRS[S.hours]??4;const daysN=()=>Math.round(hrsN()*365/24);
const planDate=()=>{const d=new Date();d.setDate(d.getDate()+21);return d.toLocaleDateString((L()==='en'?'en':L())+'-IN',{day:'numeric',month:'long'})};
function petals(n=36){const c=['#F59E0B','#EA580C','#FBBF24','#DC2626','#F97316'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='petal';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.setProperty('--r2',(Math.random()*720)+'deg');e.style.animationDuration=(2.2+Math.random()*1.8)+'s';e.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

/* ============ pieces ============ */
const OB=['deity','name','q_role','q_want','q_hours','q_morn','st1','st2','st3','plan','ovprev','perms','report','apps','prayer','sankalp'];
function topBar(){const i=OB.indexOf(cur);return `<div class="top"><button class="back" onclick="back()" aria-label="${t('back')}">‹</button>${i>=0?`<div class="bar"><b style="width:${(i+1)/OB.length*100}%"></b></div>`:''}</div>`}
function ring(n,done,size){const beads=Math.min(n,36),R=size/2-12,c=size/2,on=Math.round(done/n*beads),r=beads>30?6:beads>18?7.5:9;
 let s=`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
 for(let i=0;i<beads;i++){const a=-Math.PI/2+(i+1)/(beads+1)*Math.PI*2;s+=`<circle class="bd ${i<on?'on':''}" cx="${(c+R*Math.cos(a)).toFixed(1)}" cy="${(c+R*Math.sin(a)).toFixed(1)}" r="${r}"/>`}
 return s+`<circle class="meru" cx="${c}" cy="${c-R}" r="${r+3}"/></svg>`}
function appIcon(a,sz=40){return a.icon?`<img src="${a.icon}" width="${sz}" height="${sz}" alt="">`:`<span class="ai" style="background:${a.col||'#888'};width:${sz}px;height:${sz}px">${esc((a.label||'?')[0])}</span>`}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const tabs=a=>`<div class="tabs">${[['home','◎','tab_today'],['read','❁','tab_read'],['settings','≡','tab_me']].map(([k,i,l])=>`<button class="${a===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t(l)}</button>`).join('')}</div>`;

/* ============ screens ============ */
const V={};let cur='';
V.lang=()=>`<div class="scr"><div style="height:24px"></div>
 <h1>${t('lang_h')}</h1><div style="height:10px"></div>
 <div class="langs">${LANGS.map(l=>`<button class="opt ${L()===l?'on':''}" onclick="S.lang='${l}';save();go('welcome')">${I[l]._name}</button>`).join('')}</div>
 <div class="grow"></div></div>`;
V.welcome=()=>`<div class="scr c"><div class="grow"></div><div style="display:flex;justify-content:center;align-items:center">${godOrder().slice(0,5).map((k,i)=>`<span style="margin:0 -10px;transform:scale(${[0.8,0.92,1.15,0.92,0.8][i]});z-index:${[1,2,3,2,1][i]};border-radius:50%;box-shadow:0 0 0 4px var(--bg)">${avatar(k,96)}</span>`).join('')}</div><div style="height:26px"></div>
 <h1 style="margin-top:24px">${t('wel_h',{god:'🙏'}).replace('🙏',L()==='en'?'God':pick({hi:'भगवान',mr:'देव',gu:'ભગવાન',bn:'ভগবান',pa:'ਪ੍ਰਭੂ',ta:'இறைவன்',te:'దేవుడు',kn:'ದೇವರು',ml:'ദൈവം'}))}</h1>
 <p class="sub">${t('wel_s')}</p><div class="grow"></div>
 <button class="btn" onclick="track('ob_start');go('deity')">${t('begin')}</button></div>`;
V.deity=()=>`<div class="scr">${topBar()}
 <h1>${t('deity_h')}</h1><p class="sub">${t('deity_s')}</p>
 <div class="gods">${godOrder().map(k=>{const d=C.deities[k];return `<button class="god ${S.deity===k?'on':''}" onclick="S.deity='${k}';save();applyGod();render()">${avatar(k)}${esc(pick(d.name))}</button>`}).join('')}</div>
 <div class="grow"></div><button class="btn stick" ${S.deity?'':'disabled'} onclick="track('ob_deity');go('name')">${t('cont')}</button></div>`;
V.name=()=>`<div class="scr">${topBar()}
 <h1>${t('name_h')}</h1><div style="height:10px"></div>
 <input class="input" id="nm" placeholder="${t('name_ph')}" value="${esc(S.name)}" maxlength="24" oninput="S.name=this.value.trim();save()" onkeydown="if(event.key==='Enter')go('q_role')" autocomplete="off">
 <div class="grow"></div><button class="btn" onclick="go('q_role')">${t('cont')}</button></div>`;
const one=(key,opts,next)=>`<div class="scr">${topBar()}<h1>${t(key)}</h1><div style="height:8px"></div>
 ${opts.map(([v,l])=>`<button class="opt ${S[key.slice(2,-2)]===v?'on':''}" onclick="S['${key.slice(2,-2)}']=${typeof v==='number'?v:`'${v}'`};save();track('${key}');render();setTimeout(()=>go('${next}'),260)">${l}<span class="chk">${S[key.slice(2,-2)]===v?'✓':''}</span></button>`).join('')}<div class="grow"></div></div>`;
V.q_role=()=>one('q_role_h',['student','college','work','business','home','retired'].map(k=>[k,t('r_'+k)]),'q_want');
V.q_want=()=>`<div class="scr">${topBar()}<h1>${t('q_want_h')}</h1><p class="sub">${t('q_want_s')}</p>
 ${['peace','focus','family','sleep','bhakti'].map(k=>`<button class="opt ${S.want.includes(k)?'on':''}" onclick="togWant('${k}')">${t('w_'+k)}<span class="chk">${S.want.includes(k)?'✓':''}</span></button>`).join('')}
 <div class="grow"></div><button class="btn" ${S.want.length?'':'disabled'} onclick="track('q_want');go('q_hours')">${t('cont')}</button></div>`;
function togWant(k){const i=S.want.indexOf(k);i<0?S.want.push(k):S.want.splice(i,1);save();vib(8);render()}
V.q_hours=()=>one('q_hours_h',[[0,t('hrs',{a:1,b:3})],[1,t('hrs',{a:3,b:5})],[2,t('hrs',{a:5,b:7})],[3,t('hrs_plus',{a:7})]],'q_morn');
V.q_morn=()=>one('q_morn_h',['phone','pray','bath','tea'].map(k=>[k,t('m_'+k)]),'st1');
V.st1=()=>`<div class="scr">${storyBg('ghat-sunrise')}${topBar().replace('class="top"','class="top" style="position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:22px;right:22px;z-index:2"')}
 <div class="grow"></div><h1>${t('st1_h')}</h1><p class="sub" style="font-size:18px">${t('st1_s')}</p><div style="height:14px"></div>
 <button class="btn" onclick="go('st2')">${t('cont')}</button></div>`;
V.st2=()=>`<div class="scr">${storyBg('scroll-night')}${topBar().replace('class="top"','class="top" style="position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:22px;right:22px;z-index:2"')}
 <div class="grow"></div><div class="big-n">${t('st2_h',{days:daysN()})}</div><h1 style="font-size:24px">${t('st2_s')}</h1><p class="sub">${t('st2_n',{h:hrsN()})}</p><div style="height:14px"></div>
 <button class="btn" onclick="go('st3')">${t('cont')}</button></div>`;
V.st3=()=>`<div class="scr c">${topBar()}<div class="grow"></div>${ring(108,108,200)}
 <h1 style="margin-top:22px;font-size:34px">${t('st3_h')}</h1><p class="sub" style="font-size:18px">${t('st3_s')}</p><div class="grow"></div>
 <button class="btn" onclick="go('reading')">${t('cont')}</button></div>`;
V.ovprev=()=>{const a=(APPS||J(PL.apps(),[])).find(x=>DISTRACT.includes(x.pkg))||{label:'Instagram',col:'#D6249F'};const lbl=a.label;
 return `<div class="scr c">${topBar()}<h1>${t('ov_h')}</h1><p class="sub">${t('ov_s')}</p>
 <div class="mini"><div class="mini-in"><div class="lockapp">${appIcon(a,30)}</div><h1 class="c" style="font-size:24px;margin-top:8px">${t('lock_h',{app:esc(lbl)})}</h1>
 <p class="sub" style="font-size:14px">${t('lock_s',{n:S.count})}</p>${ring(S.count,3,170)}<p class="mantra" style="font-size:22px;color:var(--god);margin-top:8px">${esc(japa())}</p><p class="cnt" style="font-size:30px">3 / ${S.count}</p></div></div>
 <div class="grow"></div><button class="btn" onclick="go('perms')">${t('cont')}</button></div>`};
V.reading=()=>{setTimeout(()=>{[0,1,2].forEach(i=>setTimeout(()=>{const e=document.getElementById('cr'+i);if(e)e.classList.add('on');vib(10)},500+i*800));setTimeout(()=>{if(cur==='reading')go('plan')},3200)},50);
 return `<div class="scr c"><div class="grow"></div><div style="display:flex;justify-content:center">${avatar(S.deity,96)}</div><h1 style="margin-top:18px">${t('rd_h')}</h1>
 <div style="text-align:left;display:inline-block;margin:10px auto">${[t('rd_1',{h:hrsN()}),t('rd_2',{days:daysN()}),t('rd_3')].map((x,i)=>`<div class="chk-row" id="cr${i}"><i>✓</i>${x}</div>`).join('')}</div><div class="grow"></div></div>`};
V.plan=()=>{const h=hrsN();return `<div class="scr plan">${topBar()}<h1>${t('plan_h',{date:planDate()})}</h1>
 <svg viewBox="0 0 300 190" width="100%"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#DC2626"/><stop offset="1" stop-color="#2F6B2F"/></linearGradient></defs>
 <path d="M20 40 C 110 40, 150 150, 280 150" fill="none" stroke="url(#pg)" stroke-width="5" stroke-linecap="round"/>
 <circle cx="20" cy="40" r="8" fill="#DC2626"/><circle cx="280" cy="150" r="8" fill="#2F6B2F"/>
 <text x="20" y="22" font-size="20" font-weight="800" fill="#DC2626">${t('u_h',{n:h})}</text><text x="20" y="66" font-size="12" fill="currentColor" opacity=".6">${t('plan_a')}</text>
 <text x="280" y="182" text-anchor="end" font-size="20" font-weight="800" fill="#2F6B2F">${t('u_h',{n:1})}</text><text x="248" y="132" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${t('plan_b')}</text></svg>
 <p class="sub c" style="font-size:18px;color:var(--ink);font-weight:600">${t('plan_s',{saved:t('u_h',{n:h-1})})}</p>
 <div class="grow"></div><button class="btn" onclick="track('ob_plan');go('ovprev')">${t('plan_cta')}</button></div>`};
const POPUP_BRANDS=['xiaomi','vivo','oppo','realme','oneplus'];
function permList(){const p=J(PL.perms(),{});const L=['usage','overlay'];if(p.popupNeeded||POPUP_BRANDS.includes(p.brand))L.push('popup');L.push('battery');if(['xiaomi','vivo','oppo','realme','oneplus'].includes(p.brand))L.push('autostart');p.need=L.filter(k=>k!=='battery'&&k!=='autostart');return{p,L}}
V.perms=()=>{const {p,L:list}=permList();const first=list.find(k=>!p[k]);const brand=(p.brand||'').replace(/^./,c=>c.toUpperCase());
 return `<div class="scr">${topBar()}
 <h1>${t('perm_h')}</h1><p class="sub">${t('perm_s')}</p>
 <div class="trust"><span>🔒</span><span>${t('trust')}</span></div>
 ${list.map((k,i)=>`<div class="perm ${p[k]?'ok':first===k?'':'wait'}"><span class="n">${p[k]?'✓':i+1}</span><div><b>${t('p_'+k)}</b><span class="s">${t('p_'+k+'_s',{brand})}</span></div>
  <button class="go" onclick="askPerm('${k}')">${p[k]?t('done'):t('allow')}</button></div>`).join('')}
 <div class="grow"></div><button class="btn stick" ${p.need.every(k=>p[k])?'':'disabled'} onclick="track('ob_perms_done');if(S.afterPay){S.afterPay=false;save();go('home')}else go('report')">${t('cont')}</button></div>`};

 </div>${tabs('settings')}`};

/* ---- lock + japa ---- */
let mala=0,lockPkg=LOCK||'',readWait=0;try{const gl=J(PL.getLock(),{});if(gl.unlockMin)S.unlockMin=gl.unlockMin}catch(e){}
function lockReading(){const sd=shlokaOfDay();if(sd)return sd.verses?sd.verses[0]:sd;const ids=(god().texts||[]).filter(i=>C.texts[i]);if(!ids.length)return{dev:japa()};const tx=C.texts[ids[Math.floor(Date.now()/864e5)%ids.length]];const vs=tx.verses||[];return vs[Math.floor(Date.now()/36e5)%Math.max(vs.length,1)]||{dev:japa()}}
function lockHead(){const a=(APPS||J(PL.apps(),[])).find(x=>x.pkg===lockPkg)||{label:lockLabel,pkg:lockPkg};lockLabel=lockLabel||a.label;return `<div class="lockapp">${appIcon(a,36)}</div><h1 class="c" style="margin-top:10px">${t('lock_h',{app:esc(lockLabel)})}</h1>`}
V.lock=()=>{track('lock_shown');if(S.prayer==='read'){const v=lockReading();readWait=8;setTimeout(tickRead,1000);
 return `<div class="scr c"><div style="height:20px;flex:none"></div>${lockHead()}<p class="sub">${t('lock_read')}</p>
 <div class="grow"></div><p class="verse">${esc(verseText(v))}</p>${v.meaning?`<p class="mean">${esc(pick(v.meaning))}</p>`:''}<div class="grow"></div>
 <button class="btn" id="rd" disabled onclick="finish()">${t('wait_s',{s:readWait})}</button>
 <button class="link" onclick="leave()">${t('goback')}</button></div>`}
 return japaView(true)};
V.japa=()=>japaView(false);
function japaView(isLock){const done=mala>=S.count;
 return `<div class="scr c" ${done?'':'onclick="bead()"'}>
 ${isLock?`<div style="height:12px;flex:none"></div>${lockHead()}<p class="sub">${done?t('unlocked',{app:esc(lockLabel),m:S.unlockMin}):t('lock_s',{n:S.count})}</p>`:`<div class="top"><button class="back" onclick="event.stopPropagation();go('home')">‹</button></div><h1>${done?t('mala_done'):t('pr_jap')}</h1>`}
 <div class="grow"></div><div id="rg">${ring(S.count,mala,250)}</div>
 <p class="mantra" style="margin-top:14px;color:var(--god)">${esc(japa())}</p>
 <p class="cnt" id="ct">${mala} / ${S.count}</p><div class="grow"></div>
 ${done?(isLock?`<button class="btn" onclick="finish()">${t('open',{app:esc(lockLabel)})}</button>`:`<button class="btn" onclick="go('home')">${t('jai')} 🙏</button>`):`<p class="fine" style="margin-bottom:6px">${t('tap')}</p>`}
 ${isLock&&!done?`<button class="link" onclick="event.stopPropagation();leave()">${t('goback')}</button>`:''}</div>`}
function bead(){if(mala>=S.count)return;mala++;S.japToday++;S.japTotal++;save();
 if(mala>=S.count){try{PL.haptic('done',80)}catch(e){}markPrayed();render();return}
 vib(12);document.getElementById('rg').innerHTML=ring(S.count,mala,250);const c=document.getElementById('ct');c.textContent=mala+' / '+S.count;c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')}
function tickRead(){if(cur!=='lock')return;readWait--;const b=document.getElementById('rd');if(!b)return;if(readWait<=0){b.disabled=false;b.textContent=t('read_done')}else{b.textContent=t('wait_s',{s:readWait});setTimeout(tickRead,1000)}}
function markPrayed(){if(!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-400)}save();track('prayer_done',{p:S.prayer,n:S.count});if(!lockPkg)PL.prayed()}
function finish(){if(S.prayer==='read')markPrayed();track('unlocked');if(lockPkg)PL.unlocked(lockPkg);else go('home')}
function leave(){track('lock_left');PL.goHome()}

/* ============ router ============ */
const FLOW=['lang','welcome','deity','name','q_role','q_want','q_hours','q_morn','st1','st2','st3','reading','plan','ovprev','perms','report','apps','prayer','sankalp','pay'];
function go(s){cur=s;if(FLOW.includes(s)&&!S.done){S.step=s;save()}render();try{document.querySelector('.scr').scrollTop=0}catch(e){}}
function back(){if(cur==='plan')return go('st3');if(S.done&&['deity','apps','prayer','perms'].includes(cur))return go('settings');const i=FLOW.indexOf(cur);if(i>0)go(FLOW[i-1])}
window.goBack=()=>{if(LOCK)return false;if(['home'].includes(cur))return false;if(['read','settings','japa'].includes(cur)){go('home');return true}if(cur==='reader'){go('read');return true}if(['pay','chose','env','gold','guard','last','offer3'].includes(cur))return false;back();return true};
function render(){applyGod();document.getElementById('app').innerHTML=V[cur]();bindHold();const n=document.getElementById('nm');if(n&&!S.name)setTimeout(()=>n.focus(),300)}
function bindHold(){const h=document.getElementById('hold');if(!h)return;let st=0,raf=0;
 const fill=()=>{if(!st)return;const p=Math.min((performance.now()-st)/2000,1);h.querySelector('svg').outerHTML=ring(36,36*p,190);if(p>=1){st=0;try{PL.haptic('done',90)}catch(e){}S.done=true;save();pushLock();try{if(!J(PL.perms(),{}).notif)PL.openPerm('notif')}catch(e){}track('onboarding_completed');setTimeout(()=>go(S.plus?'home':'pay'),350);return}raf=requestAnimationFrame(fill)};
 h.addEventListener('pointerdown',e=>{e.preventDefault();st=performance.now();vib(10);raf=requestAnimationFrame(fill)});
 const up=()=>{if(!st)return;st=0;cancelAnimationFrame(raf);const s=h.querySelector('svg');if(s)s.outerHTML=ring(36,0,190)};
 h.addEventListener('pointerup',up);h.addEventListener('pointerleave',up);h.addEventListener('pointercancel',up)}

/* ============ browser-preview Android mocks ============ */
function mockSheet(k,ok){const old=document.getElementById('mock');if(old)old.remove();const d=document.createElement('div');d.id='mock';
 const close=()=>d.remove();
 if(k==='battery'){d.className='dlg';d.innerHTML=`<div><h4>Let app always run in background?</h4><p>Allowing Prayer Lock to always run in the background may reduce battery life. You can change this later from Settings › Apps.</p><div class="acts"><button id="m0">Deny</button><button id="m1">Allow</button></div></div>`}
 else if(k==='notif'){d.className='dlg';d.innerHTML=`<div style="text-align:center"><div style="font-size:26px;margin-bottom:8px">🔔</div><h4>Allow <b>Prayer Lock</b> to send you notifications?</h4><div class="acts" style="flex-direction:column"><button id="m1">Allow</button><button id="m0">Don’t allow</button></div></div>`}
 else{const title={usage:'Usage access',overlay:'Display over other apps',autostart:'Autostart',popup:'Display pop-up windows while running in the background'}[k];d.className='sheet';
  d.innerHTML=`<div class="hd"><span id="m0" style="cursor:pointer">←</span>${title}</div><div class="hint">${t('set_find')}</div>
  ${[['Chrome','#4285F4'],['Prayer Lock','#D9560B'],['Truecaller','#0087FF'],['YouTube','#FF0000']].map(([n,c])=>`<div class="row"><span class="ico" style="background:${c}"></span><div>${n}<small>Not allowed</small></div>${n==='Prayer Lock'?`<span class="tog" id="m1"></span><span class="poke">👆</span>`:`<span class="tog"></span>`}</div>`).join('')}`}
 document.body.appendChild(d);
 d.querySelector('#m0').onclick=close;
 d.querySelector('#m1').onclick=e=>{e.target.classList.add('on');setTimeout(()=>{close();ok()},k==='battery'||k==='notif'?50:600)}}

/* ============ boot ============ */
(function boot(){
 if(q.get('dark'))S.dark=q.get('dark')==='1';if(q.get('theme'))S.theme=q.get('theme');if(q.get('font'))S.font=q.get('font');if(q.get('btn'))S.btn=q.get('btn');
 if(q.get('brand')&&PL._mock)PL.setBrand(q.get('brand'));
 if(q.get('reset')){localStorage.removeItem('pl');for(const k of Object.keys(S))delete S[k];Object.assign(S,{lang:'',deity:'',name:'',apps:[],labels:{},prayer:'jap',count:11,mode:'every',unlockMin:15,step:'lang',done:false,plus:false,spun:false,japDay:today(),japToday:0,japTotal:0,days:[],t2:600,dark:q.get('dark')==='1',theme:q.get('theme')||'marigold',font:q.get('font')||'baloo',btn:q.get('btn')||'chunky',role:'',want:[],hours:-1,morn:'',env1:0,envDone:false,o3until:0,rem:{am:'06:30',pm:'19:00'}})}
 if(q.get('lang')&&q.get('s'))S.lang=q.get('lang');
 try{S.plus=S.plus||!!PL.isPlus()}catch(e){}
 if(!S.deity&&LOCK)S.deity=Object.keys(C.deities)[0];
 if(LOCK){lockPkg=LOCK;return go('lock')}
 const jumpTo=q.get('s');if(jumpTo){if(!S.lang)S.lang=q.get('lang')||'hi';if(!S.deity)S.deity=q.get('god')||godOrder()[0];if(jumpTo==='lock'){lockPkg='com.instagram.android';lockLabel='Instagram'}return go(jumpTo)}
 if(!S.done)return go(S.step||'lang');
 go(S.plus?'home':'pay');
})();
</script>
