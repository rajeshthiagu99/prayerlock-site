<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Lock — preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#e9e2d6;display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px;min-height:100vh}
.ctl{width:280px;font-size:14px;position:sticky;top:24px}
h1{font-size:22px}
p{color:#555;line-height:1.4;margin:6px 0 12px}
.g{margin:14px 0 6px;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#777}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;font-size:13px;padding:6px 10px;border:1.5px solid #333;background:#fff;border-radius:8px;cursor:pointer}
button.on{background:#222;color:#fff}
.phone{width:390px;height:844px;border-radius:44px;border:11px solid #111;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25);flex:none;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:760px){body{padding:0;flex-direction:column;gap:0}.ctl{width:auto;position:static;padding:10px}.ctl p,.ctl .jump{display:none}.phone{width:100vw;height:calc(100dvh - 120px);border:0;border-radius:0}}
</style>
</head>
<body>
<div class="ctl">
  <h1>Prayer Lock</h1>
  <p>This is the real app's screen code (<code>app/src/main/assets/index.html</code>). The Android permission and billing screens are simulated here; on a phone they are the real system screens.</p>
  <div class="g">Language</div><div class="row" id="langs"></div>
  <div class="g">Phone brand (changes the autostart step)</div>
  <select id="brand"><option value="xiaomi">Xiaomi / Redmi / POCO</option><option value="vivo">Vivo / iQOO</option><option value="oppo">Oppo</option><option value="realme">Realme</option><option value="samsung">Samsung</option><option value="google">Pixel</option></select>
  <div class="g">Look</div><div class="row"><button id="lt" class="on">Marigold</button><button id="dk">Sandhya (dark)</button></div>
  <div class="g">Start</div><div class="row"><button id="restart">Start from the beginning</button></div>
  <div class="jump"><div class="g">Jump to screen</div><div class="row" id="jump"></div></div>
</div>
<div class="phone"><iframe id="f"></iframe></div>
<script>
const APP='app/index.html';
const LG=[['hi','हिन्दी'],['ta','தமிழ்'],['te','తెలుగు'],['kn','ಕನ್ನಡ'],['ml','മലയാളം'],['mr','मराठी'],['bn','বাংলা'],['gu','ગુજરાતી'],['pa','ਪੰਜਾਬੀ'],['en','English']];
const SC=['deity','perms','report','apps','prayer','sankalp','pay','guilt','spin','offer2','home','read','settings','lock'];
let st={lang:'hi',brand:'xiaomi',dark:0,s:''};
function load(){const p=new URLSearchParams({lang:st.lang,brand:st.brand,dark:st.dark});if(st.s)p.set('s',st.s);else p.set('reset','1');
 document.getElementById('f').src=APP+'?'+p;draw()}
function draw(){
 langs.innerHTML=LG.map(([k,n])=>`<button class="${st.lang===k?'on':''}" onclick="st.lang='${k}';st.s=st.s||'deity';load()">${n}</button>`).join('');
 jump.innerHTML=SC.map(s=>`<button class="${st.s===s?'on':''}" onclick="st.s='${s}';load()">${s}</button>`).join('');
 lt.className=st.dark?'':'on';dk.className=st.dark?'on':''}
brand.onchange=()=>{st.brand=brand.value;st.s='perms';load()};
lt.onclick=()=>{st.dark=0;st.s=st.s||'home';load()};dk.onclick=()=>{st.dark=1;st.s=st.s||'home';load()};
restart.onclick=()=>{st.s='';load()};
load();
</script>
</body>
</html>
